<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number OCR - Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: -apple-system, sans-serif; 
            background: #000; color: #fff; overflow: hidden; touch-action: manipulation;
            user-select: none;
        }
        
        #camera-container { 
            position: relative; width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        video { 
            position: absolute; width: 100%; height: 100%; 
            object-fit: cover; top: 0; left: 0;
        }
        
        #scanner-overlay {
            position: absolute; width: 92%; max-width: 650px; height: 130px;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
            z-index: 10; border-radius: 8px; pointer-events: none;
            border: 3px solid #00ff88;
            top: 30%;
        }

        #instruction {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 20; background: rgba(0,0,0,0.85); color: #fff;
            padding: 8px 14px; border-radius: 16px; font-size: 11px;
            white-space: nowrap; max-width: 90vw;
        }
        
        /* Big loading overlay */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff;
        }
        
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(0,255,136,0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text {
            font-size: 16px; color: #00ff88; margin-bottom: 10px;
        }
        .loading-subtext {
            font-size: 12px; color: #888;
            max-width: 80%; text-align: center;
            line-height: 1.5;
        }
        
        .progress-bar {
            width: 80%; max-width: 300px; height: 8px;
            background: rgba(255,255,255,0.1); border-radius: 4px;
            margin-top: 15px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #00ff88;
            transition: width 0.3s; width: 0%;
        }
        
        #debug-panel {
            position: absolute; top: 50px; left: 5px; right: 5px;
            z-index: 15; display: flex; gap: 4px; justify-content: center;
        }
        
        .preview-box {
            background: rgba(0,0,0,0.7); border: 2px solid #00ff88;
            border-radius: 4px; padding: 2px;
            text-align: center;
        }
        .preview-box canvas {
            display: block; width: 120px; height: auto;
            border-radius: 2px; background: #fff;
        }
        .preview-label {
            font-size: 9px; color: #00ff88;
        }

        #result-panel {
            position: absolute; bottom: 10px; left: 5px; right: 5px;
            background: rgba(255,255,255,0.98); padding: 10px;
            border-radius: 12px; color: #000; text-align: center; z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-height: 60vh; overflow-y: auto;
        }

        .status { 
            font-size: 11px; color: #666; margin-bottom: 6px;
        }
        .status.error { color: #d32f2f; font-weight: bold; }
        .status.success { color: #00aa44; font-weight: bold; }
        
        .code-main { 
            font-size: 32px; font-weight: 700; color: #00aa44; 
            letter-spacing: 2px; font-family: 'Courier New', monospace;
            min-height: 40px; line-height: 1;
            padding: 8px; background: #e8f5e8; border-radius: 6px;
            border: 2px solid #00aa44;
            word-break: break-all;
        }
        
        .code-main.empty { color: #ccc; background: #f8f8f8; border-color: #ddd; font-size: 18px; }
        
        .results-list {
            margin-top: 8px; 
            max-height: 150px; overflow-y: auto;
        }
        
        .result-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 8px; margin: 3px 0;
            background: #f5f5f5; border-radius: 4px;
            font-family: monospace; font-size: 14px;
        }
        .result-item:active { background: #00ff88; }
        .result-item.top { background: #fff8dc; border-left: 3px solid #ffa500; }
        .result-item .num { font-weight: bold; letter-spacing: 1px; }
        .result-item .meta { font-size: 10px; color: #888; }
        
        .raw-log {
            font-size: 10px; 
            font-family: monospace; text-align: left;
            max-height: 80px; overflow-y: auto;
            background: #222; color: #0f8; padding: 4px;
            border-radius: 3px; margin-top: 4px;
        }

        #start-btn {
            position: absolute; z-index: 100; padding: 18px 36px;
            background: #00ff88; color: #000; border: none; border-radius: 50px;
            font-weight: 700; font-size: 18px; 
            box-shadow: 0 8px 25px rgba(0,255,136,0.5);
        }

        #controls {
            position: absolute; top: 10px; right: 5px; z-index: 25;
            display: none; gap: 4px; flex-direction: column;
        }
        .ctrl-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn.active { background: #00ff88; color: #000; }

        canvas.hidden { display: none; }

        /* Capture button */
        #capture-btn {
            position: absolute; bottom: calc(60vh + 10px); left: 50%;
            transform: translateX(-50%); z-index: 30;
            width: 75px; height: 75px; border-radius: 50%;
            background: #fff; border: 5px solid #00ff88;
            display: none; cursor: pointer;
            transition: all 0.2s;
        }
        #capture-btn:active:not(:disabled) { 
            transform: translateX(-50%) scale(0.92);
        }
        #capture-btn:disabled {
            background: #888; border-color: #666; cursor: not-allowed;
            opacity: 0.6;
        }
        #capture-btn.scanning {
            background: #ffa500;
        }
        #capture-btn.scanning::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32px; height: 32px;
            border: 4px solid #fff; border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .btn-row {
            display: flex; gap: 6px; justify-content: center;
            margin-top: 6px;
        }
        
        .mini-btn {
            padding: 5px 12px; font-size: 11px; 
            border: 1px solid #ddd; background: #fff;
            border-radius: 4px; cursor: pointer;
        }
        .mini-btn.active { background: #00ff88; border-color: #00ff88; font-weight: bold; }
        .mini-btn.danger { background: #ff4444; color: #fff; border-color: #ff4444; }
    </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">กำลังโหลด AI...</div>
    <div class="loading-subtext" id="loading-subtext">ครั้งแรกอาจใช้เวลานาน 30-60 วินาที<br>กรุณารอให้โหลดเสร็จก่อนกดสแกน</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    
    <div id="scanner-overlay"></div>
    
    <div id="instruction" style="display:none;">📍 วางตัวเลขในกรอบ</div>
    
    <div id="debug-panel" style="display:none;">
        <div class="preview-box">
            <canvas id="preview-1"></canvas>
            <div class="preview-label">ORIGINAL</div>
        </div>
        <div class="preview-box">
            <canvas id="preview-2"></canvas>
            <div class="preview-label">ENHANCED</div>
        </div>
    </div>
    
    <div id="controls">
        <button class="ctrl-btn" id="flash-btn" onclick="toggleFlash()">💡</button>
        <button class="ctrl-btn active" id="debug-btn" onclick="toggleDebug()">🔍</button>
    </div>
    
    <button id="capture-btn" disabled onclick="captureAndScan()" title="Scan"></button>
    
    <button id="start-btn" onclick="initSystem()">📷 แตะเพื่อเริ่ม</button>

    <div id="result-panel" style="display: none;">
        <div class="status" id="status">กำลังเตรียมการ...</div>
        <div class="code-main empty" id="result">--- กดปุ่มขาวเพื่อสแกน ---</div>
        
        <div class="btn-row">
            <button class="mini-btn active" id="mode-fast" onclick="setMode('fast')">⚡ Fast (2 passes)</button>
            <button class="mini-btn" id="mode-best" onclick="setMode('best')">🎯 Best (5 passes)</button>
        </div>
        
        <div class="results-list" id="resultsList" style="display:none;"></div>
        
        <div class="raw-log" id="rawLog" style="display:none;"></div>
        
        <div class="btn-row">
            <button class="mini-btn danger" onclick="clearAll()" id="clearBtn" style="display:none;">🗑️ Clear</button>
        </div>
    </div>
</div>

<canvas id="crop-canvas" class="hidden"></canvas>
<canvas id="work-canvas" class="hidden"></canvas>

<script>
    // ===== DOM =====
    const video = document.getElementById('video');
    const canvas = document.getElementById('crop-canvas');
    const workCanvas = document.getElementById('work-canvas');
    const preview1 = document.getElementById('preview-1');
    const preview2 = document.getElementById('preview-2');
    const resultDiv = document.getElementById('result');
    const resultsListDiv = document.getElementById('resultsList');
    const rawLogDiv = document.getElementById('rawLog');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const resultPanel = document.getElementById('result-panel');
    const instruction = document.getElementById('instruction');
    const controls = document.getElementById('controls');
    const overlay = document.getElementById('scanner-overlay');
    const debugPanel = document.getElementById('debug-panel');
    const captureBtn = document.getElementById('capture-btn');
    const clearBtn = document.getElementById('clearBtn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const loadingSubtext = document.getElementById('loading-subtext');
    const progressFill = document.getElementById('progress-fill');
    
    // ===== State =====
    let worker = null;
    let workerReady = false;   // ⭐ สำคัญ - flag ว่า worker พร้อม
    let track = null;
    let flashOn = false;
    let debugMode = true;
    let isProcessing = false;
    let scanMode = 'fast';  // 'fast' = 2 passes, 'best' = 5 passes
    
    let allResults = {};
    let rawLogs = [];

    function setMode(mode) {
        scanMode = mode;
        document.getElementById('mode-fast').classList.toggle('active', mode === 'fast');
        document.getElementById('mode-best').classList.toggle('active', mode === 'best');
        statusDiv.innerText = mode === 'fast' ? 
            '⚡ โหมดเร็ว (2 strategies)' : 
            '🎯 โหมดแม่น (5 strategies, ช้ากว่า)';
    }

    function showLoading(text, subtext, progress = null) {
        loadingOverlay.style.display = 'flex';
        if (text) loadingText.innerText = text;
        if (subtext) loadingSubtext.innerHTML = subtext;
        if (progress !== null) {
            progressFill.style.width = progress + '%';
        }
    }
    
    function hideLoading() {
        loadingOverlay.style.display = 'none';
    }

    async function initSystem() {
        startBtn.style.display = 'none';
        resultPanel.style.display = 'block';
        instruction.style.display = 'block';
        controls.style.display = 'flex';
        debugPanel.style.display = 'flex';
        captureBtn.style.display = 'block';
        
        try {
            showLoading('กำลังเปิดกล้อง...', 'อนุญาตให้เข้าถึงกล้อง', 5);
            await startCamera();
            
            showLoading('กำลังโหลด AI...', 
                'ครั้งแรกอาจใช้เวลา 30-60 วินาที<br>(โหลด ~10MB จากอินเทอร์เน็ต)<br>ครั้งต่อไปจะเร็วขึ้น', 
                10);
            await initOCR();
            
        } catch (e) {
            hideLoading();
            statusDiv.innerText = "❌ " + e.message;
            statusDiv.classList.add('error');
            alert('เกิดข้อผิดพลาด: ' + e.message);
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
            track = stream.getVideoTracks()[0];
            await video.play();
            
            await new Promise(resolve => {
                if (video.videoWidth > 0) resolve();
                else video.onloadedmetadata = resolve;
            });
            
            try {
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                const advanced = [];
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    advanced.push({ focusMode: 'continuous' });
                }
                if (advanced.length > 0) {
                    await track.applyConstraints({ advanced });
                }
                if (capabilities.torch === undefined) {
                    document.getElementById('flash-btn').style.display = 'none';
                }
            } catch (e) {}
            
        } catch (err) {
            throw new Error("เปิดกล้องไม่ได้: " + err.message);
        }
    }

    async function toggleFlash() {
        if (!track) return;
        try {
            flashOn = !flashOn;
            await track.applyConstraints({ advanced: [{ torch: flashOn }] });
            document.getElementById('flash-btn').classList.toggle('active', flashOn);
        } catch (e) {}
    }

    function toggleDebug() {
        debugMode = !debugMode;
        debugPanel.style.display = debugMode ? 'flex' : 'none';
        rawLogDiv.style.display = debugMode ? 'block' : 'none';
        document.getElementById('debug-btn').classList.toggle('active', debugMode);
    }

    // ===== Initialize OCR (robust) =====
    async function initOCR() {
        try {
            // สร้าง worker พร้อม progress tracking
            worker = await Tesseract.createWorker('eng', 1, {
                logger: m => { 
                    console.log('OCR:', m);
                    
                    if (m.status && m.progress !== undefined) {
                        const progress = Math.round(m.progress * 100);
                        
                        let statusThai = m.status;
                        if (m.status.includes('loading tesseract core')) statusThai = 'โหลด Tesseract Core';
                        else if (m.status.includes('loading language')) statusThai = 'โหลดภาษา';
                        else if (m.status.includes('initializing api')) statusThai = 'เริ่มต้น API';
                        else if (m.status.includes('initialized api')) statusThai = 'API พร้อม';
                        
                        showLoading(
                            `${statusThai}...`,
                            `${progress}%`,
                            10 + progress * 0.85  // 10-95%
                        );
                    }
                },
                errorHandler: err => {
                    console.error('Worker error:', err);
                }
            });
            
            // ตั้งค่า parameters
            showLoading('ตั้งค่า...', 'เกือบเสร็จแล้ว', 95);
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789',
                tessedit_pageseg_mode: '6',
            });
            
            // ⭐ Test worker ด้วยรูปตัวอย่างเล็กๆ
            showLoading('ทดสอบ AI...', 'กำลังตรวจสอบว่าใช้งานได้', 98);
            const testCanvas = document.createElement('canvas');
            testCanvas.width = 100;
            testCanvas.height = 50;
            const tctx = testCanvas.getContext('2d');
            tctx.fillStyle = '#fff';
            tctx.fillRect(0, 0, 100, 50);
            tctx.fillStyle = '#000';
            tctx.font = 'bold 40px Arial';
            tctx.fillText('123', 10, 40);
            
            try {
                const testResult = await worker.recognize(testCanvas);
                console.log('Test OCR result:', testResult.data.text);
            } catch (e) {
                console.error('Test failed:', e);
                // ไม่ throw ยังใช้ได้
            }
            
            // ⭐ ตั้ง flag ว่าพร้อม
            workerReady = true;
            
            showLoading('✅ พร้อม!', '', 100);
            
            // เปิดปุ่ม
            captureBtn.disabled = false;
            
            // ซ่อน loading หลัง 500ms
            setTimeout(() => {
                hideLoading();
                statusDiv.innerText = "✅ พร้อมสแกน - กดปุ่มขาว";
                statusDiv.classList.add('success');
            }, 500);
            
        } catch (e) {
            console.error('Init OCR failed:', e);
            throw new Error("AI โหลดไม่ได้: " + e.message);
        }
    }

    function calculateROI() {
        const videoRect = video.getBoundingClientRect();
        const overlayRect = overlay.getBoundingClientRect();
        
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (vw === 0) return null;
        
        const dw = videoRect.width;
        const dh = videoRect.height;
        
        const videoAspect = vw / vh;
        const displayAspect = dw / dh;
        
        let scale, offsetX = 0, offsetY = 0;
        if (videoAspect > displayAspect) {
            scale = dh / vh;
            offsetX = (vw * scale - dw) / 2;
        } else {
            scale = dw / vw;
            offsetY = (vh * scale - dh) / 2;
        }
        
        const ovLeft = overlayRect.left - videoRect.left;
        const ovTop = overlayRect.top - videoRect.top;
        
        return {
            x: Math.max(0, (ovLeft + offsetX) / scale),
            y: Math.max(0, (ovTop + offsetY) / scale),
            w: overlayRect.width / scale,
            h: overlayRect.height / scale
        };
    }

    function enhance(ctx, width, height, mode) {
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        
        if (mode === 'raw') return;
        
        let min = 255, max = 0;
        const gray = new Uint8ClampedArray(width * height);
        
        for (let i = 0, j = 0; i < data.length; i += 4, j++) {
            const g = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
            gray[j] = g;
            if (g < min) min = g;
            if (g > max) max = g;
        }
        
        if (mode === 'contrast') {
            const range = max - min;
            if (range > 10) {
                for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                    let v = Math.round(((gray[j] - min) / range) * 255);
                    v = Math.round(255 * Math.pow(v / 255, 0.8));
                    data[i] = v; data[i+1] = v; data[i+2] = v;
                }
            }
        } else if (mode === 'binary') {
            const histogram = new Array(256).fill(0);
            for (let i = 0; i < gray.length; i++) histogram[gray[i]]++;
            
            let sum = 0;
            for (let i = 0; i < 256; i++) sum += i * histogram[i];
            let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
            for (let t = 0; t < 256; t++) {
                wB += histogram[t];
                if (wB === 0) continue;
                const wF = gray.length - wB;
                if (wF === 0) break;
                sumB += t * histogram[t];
                const mB = sumB / wB;
                const mF = (sum - sumB) / wF;
                const variance = wB * wF * (mB - mF) * (mB - mF);
                if (variance > maxVar) { maxVar = variance; threshold = t; }
            }
            
            for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                const v = gray[j] < threshold ? 0 : 255;
                data[i] = v; data[i+1] = v; data[i+2] = v;
            }
        }
        
        ctx.putImageData(imageData, 0, 0);
    }
    
    function copyToPreview(srcCanvas, destCanvas) {
        if (!debugMode) return;
        try {
            const maxW = 120;
            const aspect = srcCanvas.height / srcCanvas.width;
            destCanvas.width = maxW;
            destCanvas.height = Math.round(maxW * aspect);
            destCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, destCanvas.width, destCanvas.height);
        } catch (e) {}
    }

    // Strategies ตามโหมด
    function getStrategies() {
        const fast = [
            { psm: '6', mode: 'contrast', label: 'PSM6-cont' },
            { psm: '7', mode: 'binary',   label: 'PSM7-bin' },
        ];
        const best = [
            { psm: '6',  mode: 'contrast', label: 'PSM6-cont' },
            { psm: '7',  mode: 'contrast', label: 'PSM7-cont' },
            { psm: '11', mode: 'contrast', label: 'PSM11-cont' },
            { psm: '6',  mode: 'binary',   label: 'PSM6-bin' },
            { psm: '7',  mode: 'binary',   label: 'PSM7-bin' },
        ];
        return scanMode === 'fast' ? fast : best;
    }

    async function runMultiStrategy(sourceCanvas) {
        const strategies = getStrategies();
        const results = [];
        
        for (let i = 0; i < strategies.length; i++) {
            const strat = strategies[i];
            statusDiv.innerText = `⚙️ ${i+1}/${strategies.length}: ${strat.label}...`;
            
            try {
                workCanvas.width = sourceCanvas.width;
                workCanvas.height = sourceCanvas.height;
                const wctx = workCanvas.getContext('2d', { willReadFrequently: true });
                wctx.drawImage(sourceCanvas, 0, 0);
                
                enhance(wctx, workCanvas.width, workCanvas.height, strat.mode);
                
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: strat.psm,
                });
                
                const result = await worker.recognize(workCanvas);
                const rawText = result.data.text.trim();
                const cleanText = rawText.replace(/[^0-9]/g, '');
                
                results.push({
                    strategy: strat.label,
                    raw: rawText,
                    clean: cleanText,
                    confidence: result.data.confidence
                });
                
                if (i === 0) copyToPreview(workCanvas, preview2);
            } catch (e) {
                console.error(`Strategy ${strat.label} failed:`, e);
                results.push({
                    strategy: strat.label,
                    raw: '',
                    clean: '',
                    confidence: 0,
                    error: e.message
                });
            }
        }
        
        return results;
    }

    async function captureAndScan() {
        // ⭐ เช็คว่า worker พร้อมจริงๆ
        if (!workerReady || !worker) {
            statusDiv.innerText = '⚠️ AI ยังโหลดไม่เสร็จ กรุณารอ...';
            statusDiv.classList.add('error');
            // ลอง init ใหม่
            showLoading('รอ AI...', 'ตรวจสอบสถานะ', 50);
            setTimeout(() => {
                if (workerReady) hideLoading();
            }, 2000);
            return;
        }
        
        if (isProcessing) {
            statusDiv.innerText = '⏳ กำลังประมวลผล กรุณารอ...';
            return;
        }
        
        isProcessing = true;
        captureBtn.classList.add('scanning');
        captureBtn.disabled = true;
        
        try {
            if (video.readyState < video.HAVE_CURRENT_DATA || video.videoWidth === 0) {
                statusDiv.innerText = '⚠️ กล้องยังไม่พร้อม';
                return;
            }
            
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const roi = calculateROI();
            
            if (!roi || roi.w < 10 || roi.h < 10) {
                statusDiv.innerText = '⚠️ ROI ผิดพลาด';
                return;
            }
            
            // Upscale - ลดเหลือ 3x เพื่อประหยัด RAM มือถือ
            const scale = 3;
            canvas.width = roi.w * scale;
            canvas.height = roi.h * scale;
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(video, 
                roi.x, roi.y, roi.w, roi.h,
                0, 0, canvas.width, canvas.height);
            
            copyToPreview(canvas, preview1);
            
            const results = await runMultiStrategy(canvas);
            
            let bestNumber = '';
            let bestScore = 0;
            
            results.forEach(r => {
                if (r.error) {
                    rawLogs.unshift(`❌ [${r.strategy}] ERROR: ${r.error}`);
                } else {
                    rawLogs.unshift(`[${r.strategy}] "${r.raw}" → "${r.clean}" (${Math.round(r.confidence)}%)`);
                }
                
                if (r.clean.length >= 2) {
                    if (!allResults[r.clean]) {
                        allResults[r.clean] = { count: 0, totalConf: 0 };
                    }
                    allResults[r.clean].count++;
                    allResults[r.clean].totalConf += r.confidence;
                    
                    const score = r.confidence * Math.log(r.clean.length + 1);
                    if (score > bestScore) {
                        bestScore = score;
                        bestNumber = r.clean;
                    }
                }
            });
            
            if (rawLogs.length > 30) rawLogs = rawLogs.slice(0, 30);
            rawLogDiv.innerHTML = rawLogs.slice(0, 10).map(l => `<div>${l}</div>`).join('');
            
            if (bestNumber) {
                resultDiv.innerText = bestNumber;
                resultDiv.classList.remove('empty');
                statusDiv.innerText = `✅ สแกนสำเร็จ (${Object.keys(allResults).length} ตัวเลือก)`;
                statusDiv.classList.add('success');
                statusDiv.classList.remove('error');
                
                if (navigator.vibrate) navigator.vibrate(100);
            } else {
                statusDiv.innerText = '❌ อ่านไม่ออก - ลองใหม่หรือปรับมุม';
                statusDiv.classList.add('error');
            }
            
            updateResultsList();
            clearBtn.style.display = 'inline-block';
            
        } catch (e) {
            statusDiv.innerText = `❌ Error: ${e.message}`;
            statusDiv.classList.add('error');
            console.error(e);
            rawLogs.unshift(`FATAL: ${e.message}`);
            rawLogDiv.innerHTML = rawLogs.slice(0, 10).map(l => `<div>${l}</div>`).join('');
        } finally {
            isProcessing = false;
            captureBtn.classList.remove('scanning');
            captureBtn.disabled = false;
        }
    }
    
    function updateResultsList() {
        const sorted = Object.entries(allResults)
            .map(([num, info]) => ({
                num,
                count: info.count,
                avgConf: info.totalConf / info.count,
                length: num.length
            }))
            .sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                if (b.length !== a.length) return b.length - a.length;
                return b.avgConf - a.avgConf;
            });
        
        if (sorted.length === 0) {
            resultsListDiv.style.display = 'none';
            return;
        }
        
        resultsListDiv.style.display = 'block';
        resultsListDiv.innerHTML = 
            '<div style="font-size:11px; color:#888; margin-bottom:4px; text-align:left; padding:0 4px;">ผลลัพธ์ (แตะเพื่อเลือก):</div>' +
            sorted.slice(0, 10).map((r, i) => 
                `<div class="result-item ${i === 0 ? 'top' : ''}" onclick="selectResult('${r.num}')">
                    <span class="num">${r.num}</span>
                    <span class="meta">${r.length}d × ${r.count} (${Math.round(r.avgConf)}%)</span>
                </div>`
            ).join('');
    }
    
    function selectResult(num) {
        resultDiv.innerText = num;
        resultDiv.classList.remove('empty');
        
        if (navigator.clipboard) {
            navigator.clipboard.writeText(num).then(() => {
                statusDiv.innerText = `📋 Copied: ${num}`;
                statusDiv.classList.add('success');
            }).catch(() => {
                statusDiv.innerText = `เลือก: ${num}`;
            });
        } else {
            statusDiv.innerText = `เลือก: ${num}`;
        }
        
        if (navigator.vibrate) navigator.vibrate(50);
    }
    
    function clearAll() {
        allResults = {};
        rawLogs = [];
        resultDiv.innerText = '--- กดปุ่มขาวเพื่อสแกน ---';
        resultDiv.classList.add('empty');
        resultsListDiv.style.display = 'none';
        rawLogDiv.innerHTML = '';
        clearBtn.style.display = 'none';
        statusDiv.innerText = '🗑️ เคลียร์แล้ว - พร้อมสแกนใหม่';
        statusDiv.classList.remove('success', 'error');
    }
</script>
