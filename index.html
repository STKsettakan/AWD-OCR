<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time High Precision OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #000; color: #fff; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        /* กรอบเล็งสีเขียว (ROI) */
        #scanner-overlay {
            position: absolute; width: 80%; height: 100px;
            border: 2px solid #00ff00; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
            z-index: 10; border-radius: 8px;
        }
        #scanner-overlay::after {
            content: "วางรหัสให้อยู่ในกรอบนี้"; position: absolute; top: -30px; left: 0;
            width: 100%; text-align: center; color: #00ff00; font-size: 14px;
        }

        #result-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(255,255,255,0.9); padding: 15px;
            border-radius: 12px; color: #000; text-align: center; z-index: 20;
        }
        .code { font-size: 28px; font-weight: bold; color: #d9534f; margin-bottom: 5px; }
        .status { font-size: 12px; color: #666; }
        canvas { display: none; } /* ซ่อนตัวประมวลผล */
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="scanner-overlay"></div>
    
    <div id="result-panel">
        <div class="status" id="status">กำลังเริ่มต้นกล้อง...</div>
        <div class="code" id="result">---</div>
        <div id="confidence">ความมั่นใจ: 0%</div>
    </div>
</div>

<canvas id="crop-canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('crop-canvas');
    const resultDiv = document.getElementById('result');
    const statusDiv = document.getElementById('status');
    const confDiv = document.getElementById('confidence');

    let worker;

    // 1. Setup Tesseract Worker ครั้งเดียวเพื่อความเร็ว
    async function initOCR() {
        statusDiv.innerText = "กำลังโหลด AI...";
        worker = await Tesseract.createWorker('tha+eng');
        statusDiv.innerText = "ระบบพร้อมสแกน";
        startScanning();
    }

    // 2. เปิดกล้อง
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            initOCR();
        } catch (err) {
            statusDiv.innerText = "เข้าถึงกล้องไม่ได้: " + err.message;
        }
    }

    // 3. ฟังก์ชันหลักในการสแกนแบบ Real-time
    async function startScanning() {
        const ctx = canvas.getContext('2d', { alpha: false });

        async function scanFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // คำนวณพื้นที่ที่จะ Crop (เอาเฉพาะส่วนในกรอบ Overlay)
                const scale = video.videoWidth / window.innerWidth;
                const boxWidth = 0.8 * window.innerWidth * scale;
                const boxHeight = 100 * scale;
                const boxX = (video.videoWidth - boxWidth) / 2;
                const boxY = (video.videoHeight - boxHeight) / 2;

                canvas.width = boxWidth;
                canvas.height = boxHeight;

                // วาดเฉพาะส่วนที่ต้องการสแกน
                ctx.drawImage(video, boxX, boxY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

                // --- Pre-processing แบบ Real-time ---
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    // ทำ Thresholding ปรับความคม
                    let v = brightness < 120 ? 0 : 255; 
                    data[i] = data[i+1] = data[i+2] = v;
                }
                ctx.putImageData(imgData, 0, 0);

                // ส่งไปอ่าน
                const result = await worker.recognize(canvas);
                const text = result.data.text.trim();
                const confidence = result.data.confidence;

                // กรองผลลัพธ์: เอาเฉพาะที่มีความแม่นยำ 50% ขึ้นไป และมีตัวเลข/อักษรไทย
                if (confidence > 50 && text.length > 5) {
                    const cleanText = text.replace(/[^ก-ฮ0-9-]/g, '');
                    resultDiv.innerText = cleanText;
                    confDiv.innerText = `ความมั่นใจ: ${Math.round(confidence)}%`;
                    resultDiv.style.color = "#28a745"; // สีเขียวเมื่ออ่านได้แม่น
                } else {
                    resultDiv.style.color = "#d9534f"; // สีแดงตอนกำลังเดา
                }
            }
            
            // วนลูปสแกน (ใช้ requestAnimationFrame หรือหน่วงเวลาเล็กน้อยเพื่อไม่ให้เครื่องร้อน)
            setTimeout(scanFrame, 500); 
        }

        scanFrame();
    }

    startCamera();
</script>

</body>
</html>
